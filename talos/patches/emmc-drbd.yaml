# Split the boot eMMC (256 GB) between Talos and DRBD instead of giving it all to /var.
# Machine config only: works with the standard images, no rebuild.
#
#   EPHEMERAL (/var: images, logs, emptyDir)   48 GiB
#   r-drbd    raw partition for LINSTOR          150 GiB  -> /dev/disk/by-partlabel/r-drbd
#   rest      left unallocated for a second partition later (another RawVolumeConfig)
#
# Apply with the node's FIRST config (holzkube stored patch, or --config-patch).
# EPHEMERAL is sized when it is created; shrinking it later means wiping it:
#   talosctl -n <ip> reset --system-labels-to-wipe EPHEMERAL --reboot --graceful=false
# Check afterwards:  talosctl -n <ip> get volumestatus ; talosctl -n <ip> get discoveredvolumes
#
# Adjust the sizes for smaller eMMC modules (64 GB: EPHEMERAL 24GiB, drbd 32GiB).
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 24GiB
  maxSize: 48GiB
  grow: false
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: drbd                       # partition label r-drbd
provisioning:
  diskSelector:
    match: system_disk
  minSize: 150GiB
  maxSize: 150GiB
