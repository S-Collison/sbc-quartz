# U-Boot for the Pine64 RK3566 family (Quartz64 A/B, SOQuartz on its baseboards).
# One stage builds every board out-of-tree and installs
#   /rootfs/artifacts/arm64/u-boot/<board>/u-boot-rockchip.bin
# <board> must match the overlay/installer name (see installers/quartz64).
#
# References:
#   - https://u-boot.readthedocs.io/en/latest/board/rockchip/rockchip.html
name: u-boot-quartz64
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3568
  - stage: rkbin-rk3566
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        mkdir -p /usr/bin \
          && ln -sf /toolchain/bin/env /usr/bin/env \
          && ln -sf /toolchain/bin/python3 /toolchain/bin/python

        pip3 install pyelftools setuptools

        tar xf u-boot.tar.bz2 --strip-components=1

        patch -p1 < /pkg/patches/uboot-byteorder.patch
    build:
      - |
        BL31=/libs/arm-trusted-firmware/rk3568/bl31.elf
        TPL="$(ls /libs/rkbin/rk3566_ddr_1056MHz_v*.bin | sort -V | tail -n1)"
        test -f "${BL31}" || { echo "missing BL31 ${BL31}"; exit 1; }
        test -f "${TPL}"  || { echo "missing rk3566 DDR TPL blob"; exit 1; }
        echo "BL31=${BL31} TPL=${TPL}"

        for board in quartz64-a quartz64-b soquartz-blade soquartz-model-a soquartz-cm4; do
          make O=build/${board} ${board}-rk3566_defconfig
          make O=build/${board} -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31="${BL31}" ROCKCHIP_TPL="${TPL}"
          test -s build/${board}/u-boot-rockchip.bin
        done
    install:
      - |
        for board in quartz64-a quartz64-b soquartz-blade soquartz-model-a soquartz-cm4; do
          mkdir -p /rootfs/artifacts/arm64/u-boot/${board}
          cp build/${board}/u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/${board}/
        done
finalize:
  - from: /rootfs
    to: /rootfs
