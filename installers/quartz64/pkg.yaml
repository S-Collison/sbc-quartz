name: quartz64-installers
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
steps:
  - env:
      GOPATH: /go
    cachePaths:
      - /.cache/go-build
      - /go/pkg
    build:
      - |
        export PATH=${PATH}:${TOOLCHAIN}/go/bin

        cd /pkg/src
        # One installer binary per overlay name; the board is baked in at link time.
        for board in quartz64-a quartz64-b soquartz-blade soquartz-model-a soquartz-cm4; do
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.board=${board}" -o ./out/${board} .
        done
    install:
      - |
        mkdir -p /rootfs/installers/
        cp /pkg/src/out/* /rootfs/installers/
finalize:
  - from: /rootfs
    to: /rootfs
