name: sbc-quartz
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: quartz64-installers
  - stage: profiles
  - stage: u-boot-quartz64
    platform: linux/arm64
  # All Rockchip DTBs from the kernel Talos actually boots (PKGS, set per Talos
  # release), with the YT8511 PHY fix (artifacts/quartz64/dtb/pkg.yaml).
  - stage: dtb-quartz64
    platform: linux/arm64
finalize:
  - from: /rootfs
    to: /
