# Builds the overlay, then Talos SD/eMMC images + upgrade installers for each
# board, in two flavors:
#   stock  - the Talos kernel, plus the Ethernet driver if that release lacks it
#   media  - same kernel + Hantro/RGA (kernel.yaml)
# and publishes a GitHub Release named after the git tag. A media failure never
# blocks the stock images.
#
# The tag is the version (no version file): v1.14.5 builds Talos v1.14.5 with the
# kernel pkgs that Talos release pins. Fixes from this repo don't get new tags:
# track.yaml moves the version's tag to main and rebuilds, replacing the release.
# track.yaml creates those tags and dispatches this workflow on them, so a
# normal run needs no human. Pushing a v* tag by hand works the same way.
# Every tag run builds, even if the release already exists (its assets are replaced).
#
# Manual builds (Actions > images > Run workflow on main) take any upstream Talos tag,
# prereleases included (v1.15.0-beta.1, v1.14.5, ...), and publish a prerelease named
# build-<talos>. Running it again for the same version replaces that release and its
# tag with the new build, so betas and older versions can be regenerated at will
# without touching the vX.Y.Z tags. Untick "publish" for a 7-day artifact-only run.
name: images
run-name: images ${{ github.ref_type == 'tag' && github.ref_name || inputs.talos_version || 'latest' }}
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Upstream Talos tag to build, e.g. v1.15.0-beta.1 or v1.14.5 (empty = latest release). Ignored on tag runs"
        required: false
      publish:
        description: "Publish as prerelease build-<talos> (replaces an earlier build of the same version)"
        type: boolean
        default: true
      media:
        description: "Also build the media (Hantro) flavor. First run builds the kernel: several hours"
        type: boolean
        default: true
      netboot:
        description: "Also build the PXE/TFTP netboot tree"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write      # keyless cosign signatures (GitHub OIDC identity)

concurrency:
  # one queue per ref and version, so manual builds of different versions don't cancel each other
  group: images-${{ github.ref }}-${{ inputs.talos_version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    outputs:
      talos: ${{ steps.v.outputs.talos }}
      pkgs: ${{ steps.v.outputs.pkgs }}
      overlay_tag: ${{ steps.v.outputs.overlay_tag }}
      release_tag: ${{ steps.v.outputs.release_tag }}
      manual: ${{ steps.v.outputs.manual }}
      custom_base: ${{ steps.v.outputs.custom_base }}
      owner: ${{ steps.v.outputs.owner }}
      media: ${{ steps.v.outputs.media }}
      netboot: ${{ steps.v.outputs.netboot }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.talos_version }}
          MEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.media || github.event_name != 'workflow_dispatch' }}
          NETBOOT: ${{ github.event_name == 'workflow_dispatch' && inputs.netboot }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          # The tag is the version: v1.14.5 builds Talos v1.14.5.
          release_tag=""; manual=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            release_tag="${GITHUB_REF_NAME}"; overlay_tag="${GITHUB_REF_NAME}"
            talos="${GITHUB_REF_NAME}"
          else
            talos="${INPUT:-$(gh api repos/siderolabs/talos/releases/latest --jq .tag_name)}"
            overlay_tag="${talos}-$(git rev-parse --short HEAD)"
            if [ "${PUBLISH}" = true ]; then release_tag="build-${talos}"; manual=true; fi
          fi
          # vX.Y.Z, or an upstream prerelease vX.Y.Z-alpha.N / -beta.N / -rc.N
          [[ "${talos}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::'${talos}' is not a Talos version (vX.Y.Z or vX.Y.Z-beta.N)"; exit 1; }
          curl -fsI "https://github.com/siderolabs/talos/releases/tag/${talos}" >/dev/null || { echo "::error::no upstream Talos release ${talos}"; exit 1; }
          # kernel build (DTBs, media kernel base) pinned by that Talos release
          pkgs="$(curl -fsSL "https://raw.githubusercontent.com/siderolabs/talos/${talos}/Makefile" \
                  | sed -nE 's/^PKGS \?= *(.*)$/\1/p' | head -n1)"
          [ -n "${pkgs}" ] || { echo "::error::could not find PKGS in the Talos ${talos} Makefile"; exit 1; }
          # Does that release's kernel have the Motorcomm YT8511 PHY driver (Quartz64 A / SOQuartz
          # Ethernet)? The 1.14 series doesn't; then the regular images use our "base" kernel.
          sha="$(gh api "repos/siderolabs/pkgs/commits/${pkgs##*-g}" --jq .sha)"
          kcfg="$(curl -fsSL "https://raw.githubusercontent.com/siderolabs/pkgs/${sha}/kernel/build/config-arm64")"
          if grep -qx 'CONFIG_MOTORCOMM_PHY=y' <<<"${kcfg}"; then custom_base=false; else custom_base=true; fi
          echo "Talos ${talos} kernel (pkgs ${pkgs}) has CONFIG_MOTORCOMM_PHY=y: $([ "${custom_base}" = false ] && echo yes || echo no)"
          {
            echo "talos=${talos}"; echo "pkgs=${pkgs}"
            echo "overlay_tag=${overlay_tag}"; echo "release_tag=${release_tag}"; echo "manual=${manual}"; echo "custom_base=${custom_base}"
            echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            echo "media=${MEDIA}"; echo "netboot=${NETBOOT:-false}"
          } | tee -a "$GITHUB_OUTPUT"

  overlay:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/setup-qemu-action@v4      # amd64 half of the overlay (installer binaries only)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push overlay
        run: |
          make docker-sbc-quartz \
            PLATFORM=linux/arm64,linux/amd64 \
            PKGS="${{ needs.resolve.outputs.pkgs }}" \
            TARGET_ARGS="--tag=${REGISTRY}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }} --push=true"

  # Our kernel for the regular images, only when the release's own kernel lacks the
  # YT8511 PHY driver (1.14 series): Sidero's config + kernel/base.config, no V4L/Hantro.
  base-kernel:
    needs: resolve
    if: needs.resolve.outputs.custom_base == 'true'
    uses: ./.github/workflows/kernel.yaml
    with:
      talos: ${{ needs.resolve.outputs.talos }}
      pkgs: ${{ needs.resolve.outputs.pkgs }}
      flavor: base
    secrets: inherit

  media-kernel:
    needs: resolve
    if: needs.resolve.outputs.media == 'true'
    uses: ./.github/workflows/kernel.yaml
    with:
      talos: ${{ needs.resolve.outputs.talos }}
      pkgs: ${{ needs.resolve.outputs.pkgs }}
      flavor: media
    secrets: inherit

  # Groundwork for a self-hosted Image Factory: official overlay catalog + our
  # boards as ghcr.io/<owner>/overlays:<talos>, overlay + catalog signed. Never blocks.
  catalog:
    needs: [resolve, overlay]
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: imjasonh/setup-crane@v0.7
      - name: Sign overlay, publish catalog
        env:
          OWNER: ${{ needs.resolve.outputs.owner }}
          TALOS: ${{ needs.resolve.outputs.talos }}
          OVERLAY_TAG: ${{ needs.resolve.outputs.overlay_tag }}
        run: |
          set -euo pipefail
          overlay="${REGISTRY}/${OWNER}/sbc-quartz"
          digest="$(crane digest "${overlay}:${OVERLAY_TAG}")"
          cosign sign --yes "${overlay}@${digest}"
          mkdir -p cat && cd cat
          crane export "ghcr.io/siderolabs/overlays:${TALOS}" - | tar x overlays.yaml 2>/dev/null || echo "overlays: []" > overlays.yaml
          python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null || true
          OVERLAY="${overlay}:${OVERLAY_TAG}" DIGEST="${digest}" python3 - <<'PY2'
          import os, re, yaml
          cat = yaml.safe_load(open("overlays.yaml")) or {}
          cat.setdefault("overlays", [])
          boards = re.findall(r"^    ([a-z0-9-]+):", open("../Pkgfile").read(), re.M)
          names = {o["name"] for o in cat["overlays"]}
          for b in boards:
              if b not in names:
                  cat["overlays"].append({"name": b, "image": os.environ["OVERLAY"], "digest": os.environ["DIGEST"]})
          yaml.safe_dump(cat, open("overlays.yaml", "w"), sort_keys=False)
          print(open("overlays.yaml").read())
          PY2
          printf 'FROM scratch\nCOPY overlays.yaml /overlays.yaml\n' > Dockerfile
          docker buildx build . --platform linux/arm64,linux/amd64 --tag "${REGISTRY}/${OWNER}/overlays:${TALOS}" --push
          cosign sign --yes "${REGISTRY}/${OWNER}/overlays@$(crane digest "${REGISTRY}/${OWNER}/overlays:${TALOS}")"

  images:
    name: images (stock)
    needs: [resolve, overlay, base-kernel]
    # base-kernel is skipped when the release's kernel already has the PHY driver
    if: >-
      always() && needs.resolve.result == 'success' && needs.overlay.result == 'success' &&
      (needs.base-kernel.result == 'success' || needs.base-kernel.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [quartz64-a, soquartz-blade, soquartz-model-a]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build, verify, push installer
        env:
          TALOS_VERSION: ${{ needs.resolve.outputs.talos }}
          FLAVOR: stock
          # With custom_base: our base kernel's imager/installer-base, and module signature enforcement
          # off so that extensions signed by Sidero load on it.
          IMAGER_IMAGE: ${{ needs.resolve.outputs.custom_base == 'true' && format('{0}/{1}/talos-base/imager:{2}', env.REGISTRY, needs.resolve.outputs.owner, needs.resolve.outputs.talos) || '' }}
          BASE_INSTALLER_IMAGE: ${{ needs.resolve.outputs.custom_base == 'true' && format('{0}/{1}/talos-base/installer-base:{2}', env.REGISTRY, needs.resolve.outputs.owner, needs.resolve.outputs.talos) || '' }}
          MODULE_SIG_ENFORCE: ${{ needs.resolve.outputs.custom_base == 'true' && '0' || '1' }}
          OVERLAY_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}
          INSTALLER_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-installer
          FACTORY_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}
        run: |
          if [ "${{ needs.resolve.outputs.netboot }}" = true ] && [ "${{ matrix.board }}" = quartz64-a ]; then export NETBOOT=1; fi
          bash hack/build-image.sh "${{ matrix.board }}"
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign installer (keyless)
        continue-on-error: true
        run: |
          while read -r ref; do
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
            cosign sign --yes "${ref%:*}@${digest}"
          done < _out/installer-refs.txt
      - name: Checksums
        run: cd _out && for f in *.raw.xz *.tar.gz; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done; ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: image-stock-${{ matrix.board }}
          path: |
            _out/*.raw.xz
            _out/*.tar.gz
            _out/*.sha256
          retention-days: 7

  images-media:
    name: images (media, Hantro)
    needs: [resolve, overlay, media-kernel]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [quartz64-a, soquartz-blade, soquartz-model-a]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build, verify, push installer
        env:
          TALOS_VERSION: ${{ needs.resolve.outputs.talos }}
          FLAVOR: media
          OVERLAY_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}
          INSTALLER_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-installer
          FACTORY_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}
          IMAGER_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-media/imager:${{ needs.resolve.outputs.talos }}
          BASE_INSTALLER_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-media/installer-base:${{ needs.resolve.outputs.talos }}
          # our kernel: enforcement off, so that extensions signed by Sidero load on it
          MODULE_SIG_ENFORCE: "0"
        run: |
          if [ "${{ needs.resolve.outputs.netboot }}" = true ] && [ "${{ matrix.board }}" = quartz64-a ]; then export NETBOOT=1; fi
          bash hack/build-image.sh "${{ matrix.board }}"
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign installer (keyless)
        continue-on-error: true
        run: |
          while read -r ref; do
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
            cosign sign --yes "${ref%:*}@${digest}"
          done < _out/installer-refs.txt
      - name: Checksums
        run: cd _out && for f in *.raw.xz *.tar.gz; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done; ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: image-media-${{ matrix.board }}
          path: |
            _out/*.raw.xz
            _out/*.tar.gz
            _out/*.sha256
          retention-days: 7

  release:
    needs: [resolve, images, images-media]
    # stock must succeed; media is included when it built
    if: always() && needs.images.result == 'success' && needs.resolve.outputs.release_tag != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: "image-*", merge-multiple: true }
      - name: Notes
        env:
          MEDIA_RESULT: ${{ needs.images-media.result }}
        run: |
          o=${{ needs.resolve.outputs.owner }}; t=${{ needs.resolve.outputs.talos }}
          cat > notes.md <<NOTES
          Talos **${t}** for Pine64 RK3566 boards. Overlay \`${REGISTRY}/${o}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}\`,
          kernel pkgs \`${{ needs.resolve.outputs.pkgs }}\`. Media flavor (Hantro decode): **${MEDIA_RESULT}**.

          | board | stock image | media image | upgrade installers |
          |---|---|---|---|
          | Quartz64 Model A | \`talos-${t}-quartz64-a.raw.xz\` | \`talos-${t}-quartz64-a-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-quartz64-a[-media]:${t}\` |
          | SOQuartz + Blade | \`talos-${t}-soquartz-blade.raw.xz\` | \`talos-${t}-soquartz-blade-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-soquartz-blade[-media]:${t}\` |
          | SOQuartz + Model-A | \`talos-${t}-soquartz-model-a.raw.xz\` | \`talos-${t}-soquartz-model-a-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-soquartz-model-a[-media]:${t}\` |

          Flash: \`xz -dc <image> | sudo dd of=/dev/rdiskN bs=4m\`. Serial: UART2, 1500000 8N1. Installing and upgrading: README.md.
          NOTES
          ls -la dist
      - name: Replace an earlier manual build of this version
        if: needs.resolve.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "${{ needs.resolve.outputs.release_tag }}" --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v3
        with:
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.resolve.outputs.manual == 'true' || contains(needs.resolve.outputs.talos, '-') }}
          make_latest: ${{ needs.resolve.outputs.manual != 'true' && !contains(needs.resolve.outputs.talos, '-') }}
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }} (Talos ${{ needs.resolve.outputs.talos }})
          body_path: notes.md
          files: dist/*
          # a tag always rebuilds; replace the assets of an existing release
          overwrite_files: true

  # Unattended runs (push/dispatch from track.yaml) report failures as an issue
  # instead of relying on someone reading the Actions tab. The media flavor is
  # optional, so its failure is reported too, without failing the release.
  report:
    needs: [resolve, overlay, base-kernel, media-kernel, images, images-media, release]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="images: ${{ needs.resolve.outputs.release_tag || needs.resolve.outputs.talos || github.ref_name }} failed"
          body="$(printf 'Run: %s (%s on %s)\n\n| job | result |\n|---|---|\n| resolve | %s |\n| overlay | %s |\n| media-kernel | %s |\n| images (stock) | %s |\n| images-media | %s |\n| release | %s |\n\nFix on main: the tracker moves the tag to the fix and rebuilds. Close this once that release is out.' \
            "${run_url}" "${GITHUB_EVENT_NAME}" "${GITHUB_SHA::7}" \
            "${{ needs.resolve.result }}" "${{ needs.overlay.result }}" "${{ needs.media-kernel.result }}" \
            "${{ needs.images.result }}" "${{ needs.images-media.result }}" "${{ needs.release.result }}")"
          gh label create build-failure --color D93F0B --description "Unattended build failed" --force
          n="$(gh issue list --label build-failure --state open --search 'images: in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "${body}"
          else gh issue create --label build-failure --title "${title}" --body "${body}"; fi
