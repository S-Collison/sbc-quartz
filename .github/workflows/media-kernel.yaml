# Custom Talos kernel flavors (hack/kernel-fragment.sh):
#   base  - Sidero's kernel + kernel/base.config (Motorcomm YT8511 PHY driver only).
#           images.yaml uses it for the regular images when the Talos release's own
#           kernel lacks the driver (the 1.14 series). No V4L/Hantro modules.
#   media - base + kernel/media.config (Hantro, RGA) + those modules in the module list.
#
# Images built from this kernel boot with module.sig_enforce off (hack/build-image.sh
# MODULE_SIG_ENFORCE=0), so official Sidero extensions (signed with Sidero's key) load on
# it unchanged; nothing else needs to be rebuilt or signed here.
#   1. siderolabs/pkgs @ the Talos release's PKGS commit + the flavor's fragment
#      -> talos-<flavor>/kernel
#   2. siderolabs/talos @ tag, PKG_KERNEL=<that kernel>; for media only, the Hantro/RGA/rkvdec
#      modules + their V4L2 deps appended to hack/modules-arm64.txt (hack/media-modules.py);
#      Talos only ships modules on that list
#      -> talos-<flavor>/installer-base, talos-<flavor>/imager
# Images go to ghcr.io/<owner>/talos-<flavor>/*. Each step is skipped if its image
# (keyed on the fragment) already exists.
name: media-kernel
on:
  workflow_call:
    inputs:
      talos: { type: string, required: true }   # e.g. v1.14.5
      pkgs:  { type: string, required: true }   # e.g. v1.14.0-48-gf4bda77 (PKGS from the Talos Makefile)
      flavor: { type: string, required: false, default: media }   # base | media
  workflow_dispatch:
    inputs:
      talos: { description: "Talos version, e.g. v1.14.5", required: true }
      pkgs:  { description: "PKGS for that release (Talos Makefile), e.g. v1.14.0-48-gf4bda77", required: true }
      flavor: { description: "base (PHY driver only) or media (+ Hantro/RGA)", required: false, default: media }

permissions:
  contents: read
  packages: write

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      kernel_tag: ${{ steps.v.outputs.kernel_tag }}
      ns: ${{ steps.v.outputs.ns }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          flavor="${{ inputs.flavor }}"
          case "${flavor}" in base|media) ;; *) echo "::error::flavor must be base or media"; exit 1 ;; esac
          echo "ns=${owner}/talos-${flavor}" >> "$GITHUB_OUTPUT"
          # keyed on the config fragment, so changing it builds a new kernel (and drbd for it)
          echo "kernel_tag=${{ inputs.pkgs }}-${flavor}-$(bash hack/kernel-fragment.sh "${flavor}" | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: have
        run: |
          if docker manifest inspect ghcr.io/${{ steps.v.outputs.ns }}/kernel:${{ steps.v.outputs.kernel_tag }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "kernel already built"
          fi
      - name: Checkout siderolabs/pkgs at the release commit
        if: steps.have.outputs.skip != 'true'
        run: |
          sha="${{ inputs.pkgs }}"; sha="${sha##*-g}"
          git clone --filter=blob:none https://github.com/siderolabs/pkgs pkgs
          git -C pkgs checkout --detach "${sha}"
      - name: Apply the config fragment + refresh it
        if: steps.have.outputs.skip != 'true'
        working-directory: pkgs
        run: |
          set -euo pipefail
          flavor="${{ inputs.flavor }}"
          { echo; echo "# --- sbc-quartz ${flavor} flavor ---"; bash ../hack/kernel-fragment.sh "${flavor}"; } >> kernel/build/config-arm64
          make local-kernel-build TARGET_ARGS="--build-arg=KERNEL_TARGET=olddefconfig" PLATFORM=linux/arm64 DEST=kernel/build
          want="CONFIG_MOTORCOMM_PHY=y"
          if [ "${flavor}" = media ]; then want="${want} CONFIG_VIDEO_HANTRO=m CONFIG_VIDEO_HANTRO_ROCKCHIP=y CONFIG_VIDEO_ROCKCHIP_RGA=m"; fi
          for opt in ${want}; do
            grep -qx "${opt}" kernel/build/config-arm64 || { echo "::error::${opt} did not survive olddefconfig"; exit 1; }
          done
          grep -E 'HANTRO|ROCKCHIP_RGA|ROCKCHIP_VDEC|MOTORCOMM_PHY' kernel/build/config-arm64 || true
      - name: Build + push kernel
        if: steps.have.outputs.skip != 'true'
        working-directory: pkgs
        run: |
          make kernel PLATFORM=linux/arm64 PUSH=true \
            REGISTRY=ghcr.io USERNAME=${{ steps.v.outputs.ns }} TAG=${{ steps.v.outputs.kernel_tag }}

  talos:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: imjasonh/setup-crane@v0.7
      - id: have
        run: |
          # Marker tag keyed on the config fragment (+ module resolver for media) and the Talos patch
          # below (TALOS_PATCH), so changing any of them rebuilds the imager/installer-base.
          TALOS_PATCH=no-sig-enforce-default-v1
          if [ "${{ inputs.flavor }}" = media ]; then
            mkey="$({ bash hack/kernel-fragment.sh media; cat hack/media-modules.py; echo "${TALOS_PATCH}"; } | sha256sum | cut -c1-12)"
          else
            mkey="$({ bash hack/kernel-fragment.sh base; echo "${TALOS_PATCH}"; } | sha256sum | cut -c1-12)"
          fi
          echo "marker=${{ inputs.talos }}-${mkey}" >> "$GITHUB_OUTPUT"
          if crane digest ghcr.io/${{ needs.kernel.outputs.ns }}/imager:${{ inputs.talos }}-${mkey} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "imager already built for this config"
          fi
      - name: Checkout siderolabs/talos at the release
        if: steps.have.outputs.skip != 'true'
        run: git clone --depth 1 --branch ${{ inputs.talos }} https://github.com/siderolabs/talos _talos
      - name: Drop Talos's default module.sig_enforce=1 (installer + imager)
        if: steps.have.outputs.skip != 'true'
        # Official Sidero extensions (drbd) are signed with Sidero's key, which our kernel does not
        # trust. Images boot with module.sig_enforce=0, but the installer rebuilds the cmdline on every
        # install/upgrade from kernel.DefaultArgs (which adds =1 first; the kernel cannot turn it back
        # off). Removing that default from the installer and imager we build keeps enforcement off
        # across upgrades. Only our custom kernels use this; Sidero-kernel releases are untouched.
        # Fails if the line is not found exactly once, so a Talos change is noticed, not ignored.
        run: |
          set -euo pipefail
          f=_talos/pkg/machinery/kernel/kernel.go
          n="$(grep -c 'constants.KernelParamEnforceModuleSigVerify+"=1"' "${f}" || true)"
          [ "${n}" = 1 ] || { echo "::error::expected 1 sig_enforce default in ${f}, found ${n}"; exit 1; }
          sed -i '/constants.KernelParamEnforceModuleSigVerify+"=1"/d' "${f}"
          if grep -q 'KernelParamEnforceModuleSigVerify+"=1"' "${f}"; then echo "::error::sig_enforce default still present"; exit 1; fi
          grep -n -A2 'SupportsDisablingModuleSignatureVerification' "${f}"
      - name: Add media modules to Talos's module list
        if: steps.have.outputs.skip != 'true' && inputs.flavor == 'media'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kmods
          crane export --platform linux/arm64 \
            ghcr.io/${{ needs.kernel.outputs.ns }}/kernel:${{ needs.kernel.outputs.kernel_tag }} - \
            | tar x -C /tmp/kmods usr/lib/modules
          moddir="$(ls -d /tmp/kmods/usr/lib/modules/*)"
          python3 hack/media-modules.py "${moddir}" | tee /tmp/media-modules.txt
          before="$(wc -l < _talos/hack/modules-arm64.txt)"
          cat _talos/hack/modules-arm64.txt /tmp/media-modules.txt | sort -u > /tmp/modules-arm64.txt
          mv /tmp/modules-arm64.txt _talos/hack/modules-arm64.txt
          echo "modules-arm64.txt: ${before} -> $(wc -l < _talos/hack/modules-arm64.txt) entries"
          grep -q 'hantro-vpu.ko$' _talos/hack/modules-arm64.txt || { echo "::error::hantro-vpu not in module list"; exit 1; }
      - name: Build installer-base + imager with the custom kernel
        if: steps.have.outputs.skip != 'true'
        working-directory: _talos
        run: |
          # INSTALLER_ARCH=targetarch: only arm64 install artifacts. The default ("all")
          # also builds amd64 ones from PKG_KERNEL, which we only build for arm64.
          make installer-base imager PLATFORM=linux/arm64 INSTALLER_ARCH=targetarch PUSH=true \
            REGISTRY=ghcr.io USERNAME=${{ needs.kernel.outputs.ns }} TAG=${{ inputs.talos }} \
            PKG_KERNEL=ghcr.io/${{ needs.kernel.outputs.ns }}/kernel:${{ needs.kernel.outputs.kernel_tag }}
          docker buildx imagetools create \
            -t ghcr.io/${{ needs.kernel.outputs.ns }}/imager:${{ steps.have.outputs.marker }} \
            ghcr.io/${{ needs.kernel.outputs.ns }}/imager:${{ inputs.talos }}
